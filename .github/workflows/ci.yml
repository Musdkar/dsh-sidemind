name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: sidemind-ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22.19.0'
      - run: npm test
      - run: npm run check
